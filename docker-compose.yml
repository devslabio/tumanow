services:
  postgres:
    image: postgres:16-alpine
    container_name: tumanow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tumanow
      POSTGRES_PASSWORD: tumanow
      POSTGRES_DB: tumanow
    ports:
      - "5434:5432"
    volumes:
      - tumanow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tumanow -d tumanow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tumanow_pg_data:
